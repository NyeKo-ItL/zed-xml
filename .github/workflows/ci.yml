name: CI

on:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  checks:
    name: Format and tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - name: Verify generated files are not tracked
        shell: bash
        run: |
          test -z "$(git ls-files -- 'grammars/**' '*.wasm' 'target/**')"

  native:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: xml-lsp.exe
            asset: xml-lsp-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: xml-lsp
            asset: xml-lsp-x86_64-unknown-linux-gnu

          - os: macos-14
            target: aarch64-apple-darwin
            binary: xml-lsp
            asset: xml-lsp-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Synchronize Cargo package versions with the release tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          VERSION="$VERSION" python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          manifests = [
              pathlib.Path("Cargo.toml"),
              pathlib.Path("crates/xml-core/Cargo.toml"),
              pathlib.Path("crates/xsd-core/Cargo.toml"),
              pathlib.Path("crates/xml-lsp/Cargo.toml"),
          ]
          pattern = re.compile(r'(?m)^(version\s*=\s*")[^"]+("\s*)$')
          for manifest in manifests:
              content = manifest.read_text(encoding="utf-8")
              updated, count = pattern.subn(rf'\g<1>{version}\g<2>', content, count=1)
              if count != 1:
                  raise SystemExit(f"Could not update package version in {manifest}")
              manifest.write_text(updated, encoding="utf-8", newline="\n")
          print(f"Synchronized Cargo packages to {version}")
          PY
      - run: cargo build -p xml-lsp --release --target ${{ matrix.target }}
      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: xml-lsp-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish native LSP release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xml-lsp-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
