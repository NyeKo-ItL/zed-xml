name: CI

on:
  pull_request:
  push:
    tags:
      - "v*"

jobs:
  checks:
    name: Format and tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - name: Verify generated files are not tracked
        shell: bash
        run: |
          test -z "$(git ls-files -- 'grammars/**' '*.wasm' 'target/**')"

  synchronize_release_version:
    name: Synchronize release version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.sync.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - id: sync
        name: Commit versions and move tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_VERSION"
            exit 1
          fi

          VERSION="$VERSION" python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          files = [
              pathlib.Path("Cargo.toml"),
              pathlib.Path("crates/xml-core/Cargo.toml"),
              pathlib.Path("crates/xsd-core/Cargo.toml"),
              pathlib.Path("crates/xml-lsp/Cargo.toml"),
          ]
          package_pattern = re.compile(r'(?m)^(version\s*=\s*")[^"]+("\s*)$')
          for path in files:
              content = path.read_text(encoding="utf-8")
              updated, count = package_pattern.subn(rf'\g<1>{version}\g<2>', content, count=1)
              if count != 1:
                  raise SystemExit(f"Could not update package version in {path}")
              path.write_text(updated, encoding="utf-8", newline="\n")

          extension = pathlib.Path("extension.toml")
          content = extension.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^(version\s*=\s*")[^"]+("\s*)$',
              rf'\g<1>{version}\g<2>',
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update extension.toml")
          extension.write_text(updated, encoding="utf-8", newline="\n")
          PY

          cargo check --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml crates/*/Cargo.toml Cargo.lock extension.toml
          if git diff --cached --quiet; then
            echo "commit_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: synchronize release version $RELEASE_VERSION"
          git push origin "HEAD:$DEFAULT_BRANCH"
          git push --force origin "HEAD:refs/tags/$RELEASE_VERSION"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  native:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: synchronize_release_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: xml-lsp.exe
            asset: xml-lsp-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: xml-lsp
            asset: xml-lsp-x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            binary: xml-lsp
            asset: xml-lsp-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.synchronize_release_version.outputs.commit_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build -p xml-lsp --release --target ${{ matrix.target }}
      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: xml-lsp-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish native LSP release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xml-lsp-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
