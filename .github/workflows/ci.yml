name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    tags:
      - "v*"

concurrency:
  # A new push to a pull request cancels its previous checks; the release
  # events (tag push, merged version-sync pull request) get their own group.
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Toolchain of the Clippy job (see CONTRIBUTING.md, "Continuous integration").
  CLIPPY_TOOLCHAIN: "1.98"

jobs:
  fmt:
    name: Format
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - name: Verify generated files are not tracked
        shell: bash
        run: |
          test -z "$(git ls-files -- 'grammars/**' '*.wasm' 'target/**')"

  clippy:
    name: Clippy
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so that lints added by a new stable release do not break
      # unrelated pull requests; bump it deliberately (see CONTRIBUTING.md).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CLIPPY_TOOLCHAIN }}
          components: clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy on the extension for its real target
        run: cargo clippy -p zed-xml --target wasm32-wasip2 -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  msrv:
    name: Minimum supported Rust version
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from the manifests
        id: msrv
        shell: bash
        run: |
          MSRV=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$MSRV"
          for manifest in crates/*/Cargo.toml; do
            if ! grep -qx "rust-version = \"$MSRV\"" "$manifest"; then
              echo "::error file=$manifest::rust-version must be $MSRV, as in Cargo.toml"
              exit 1
            fi
          done
          echo "version=$MSRV" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: cargo build -p zed-xml --target wasm32-wasip2 --locked

  wasm:
    name: Extension (wasm32-wasip2)
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p zed-xml --target wasm32-wasip2 --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: zed-xml-extension-wasm
          path: target/wasm32-wasip2/release/zed_xml.wasm
          if-no-files-found: error
          retention-days: 7

  deny:
    name: Dependencies (cargo-deny)
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  coverage:
    name: Coverage
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Run the tests with instrumentation
        run: cargo llvm-cov --workspace --no-report
      - name: Write the reports
        shell: bash
        run: |
          mkdir -p coverage
          cargo llvm-cov report --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --html --output-dir coverage
          cargo llvm-cov report --summary-only > coverage/summary.txt
          {
            echo "## Coverage"
            echo
            echo '```'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: error
          retention-days: 14

  conformance:
    name: Conformance suites
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      XML_TEST_SUITES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/test-suites
          key: test-suites-${{ hashFiles('scripts/fetch-test-suites.sh') }}
      - run: scripts/fetch-test-suites.sh
      - run: cargo test --release -p xml-conformance
      - run: cargo test --release -p xml-lsp fixture_smoke

  benchmarks:
    name: Benchmarks
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Quick mode checks that every benchmark builds and runs, and prints
      # its timings in the log; it compares nothing, so it cannot flake on
      # a noisy runner.
      - run: >-
          cargo bench
          -p xml-core --bench xml_core
          -p xsd-core --bench xsd_core
          -p xml-lsp --bench server
          -- --quick --noplot

  prepare_release_pr:
    name: Prepare release version PR
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Commit synchronized versions and open PR
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          BRANCH="release/version-sync-$RELEASE_TAG"
          git switch -c "$BRANCH"
          VERSION="$VERSION" python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          package_pattern = re.compile(r'(?m)^(version\s*=\s*")[^"]+("\s*)$')
          for path in [
              pathlib.Path("Cargo.toml"),
              pathlib.Path("crates/xml-core/Cargo.toml"),
              pathlib.Path("crates/xsd-core/Cargo.toml"),
              pathlib.Path("crates/dtd-core/Cargo.toml"),
              pathlib.Path("crates/xpath-core/Cargo.toml"),
              pathlib.Path("crates/xml-lsp/Cargo.toml"),
              pathlib.Path("crates/xml-conformance/Cargo.toml"),
              pathlib.Path("extension.toml"),
          ]:
              content = path.read_text(encoding="utf-8")
              updated, count = package_pattern.subn(
                  rf'\g<1>{version}\g<2>', content, count=1
              )
              if count != 1:
                  raise SystemExit(f"Could not update version in {path}")
              path.write_text(updated, encoding="utf-8", newline="\n")
          PY

          VERSION="$VERSION" python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          path = pathlib.Path("extension.toml")
          content = path.read_text(encoding="utf-8")
          capability_pattern = re.compile(
              r'(?m)^(command\s*=\s*"xml-lsp-)[0-9]+\.[0-9]+\.[0-9]+(\.exe)?(")([ \t]*$)'
          )
          updated, count = capability_pattern.subn(
              rf'\g<1>{version}\g<2>\g<3>\g<4>', content
          )
          if count != 2:
              raise SystemExit(
                  f"Expected two xml-lsp process capabilities in {path}, found {count}"
              )
          download_pattern = re.compile(
              r'(?m)^(path\s*=\s*\["NyeKo-ItL", "zed-xml", "releases", "download", "v)'
              r'[0-9]+\.[0-9]+\.[0-9]+(", "\*"\][ \t]*)$'
          )
          updated, count = download_pattern.subn(
              rf'\g<1>{version}\g<2>', updated
          )
          if count != 1:
              raise SystemExit(
                  f"Expected one xml-lsp download_file capability in {path}, found {count}"
              )
          path.write_text(updated, encoding="utf-8", newline="\n")
          PY

          cargo check --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml crates/*/Cargo.toml Cargo.lock extension.toml
          if git diff --cached --quiet; then
            echo "Versions are already synchronized."
            exit 0
          fi
          git commit -m "chore: synchronize release version $RELEASE_TAG"
          git push --force origin "HEAD:refs/heads/$BRANCH"

          PR_NUMBER=$(gh pr list --head "$BRANCH" --base "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number')
          if [[ -z "$PR_NUMBER" ]]; then
            PR_URL=$(gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH" \
              --title "chore: synchronize release version $RELEASE_TAG" \
              --body "Synchronize Cargo, Cargo.lock, and extension.toml versions with release tag $RELEASE_TAG.\n\nMerge this PR to build and publish the release.")
            PR_NUMBER="${PR_URL##*/}"
          fi
          gh pr review "$PR_NUMBER" --approve || true

  native:
    name: Build ${{ matrix.target }}
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/version-sync-v')
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with SUPPORTED_PLATFORMS in src/lib.rs (the extension
        # downloads the musl builds on Linux) and with CONTRIBUTING.md.
        # `smoke` runs the binary, so it is false for cross-compiled targets
        # (x86_64 macOS on the arm64 runner, arm64 Windows with the MSVC
        # cross tools of the x64 runner).
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: xml-lsp
            smoke: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: xml-lsp
            musl: true
            smoke: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: xml-lsp
            smoke: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: xml-lsp
            musl: true
            smoke: true
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: xml-lsp
            smoke: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: xml-lsp
            smoke: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: xml-lsp.exe
            smoke: true
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: xml-lsp.exe
            smoke: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build -p xml-lsp --release --locked --target ${{ matrix.target }}
      - name: Prepare release asset
        id: asset
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          SMOKE: ${{ matrix.smoke }}
        run: |
          EXTENSION=""
          if [[ "$BINARY" == *.exe ]]; then EXTENSION=".exe"; fi
          ASSET="xml-lsp-$TARGET$EXTENSION"
          mkdir -p dist
          cp "target/$TARGET/release/$BINARY" "dist/$ASSET"
          if [[ "$SMOKE" == "true" ]]; then
            VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/xml-lsp/Cargo.toml)
            OUTPUT=$("dist/$ASSET" --version | tr -d '\r')
            if [[ "$OUTPUT" != "xml-lsp $VERSION" ]]; then
              echo "::error::dist/$ASSET --version printed '$OUTPUT', expected 'xml-lsp $VERSION'"
              exit 1
            fi
          fi
          if [[ "$TARGET" == *-linux-musl ]] && file "dist/$ASSET" | grep -q "dynamically linked"; then
            echo "::error::$ASSET must be statically linked"
            exit 1
          fi
          echo "name=$ASSET" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: xml-lsp-${{ matrix.target }}
          path: dist/${{ steps.asset.outputs.name }}
          if-no-files-found: error

  release:
    name: Publish native LSP release assets
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/version-sync-v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: xml-lsp-*
          path: dist
          merge-multiple: true
      - name: Write SHA-256 checksums
        shell: bash
        working-directory: dist
        run: |
          shopt -s nullglob
          assets=(xml-lsp-*)
          if [[ ${#assets[@]} -ne 8 ]]; then
            echo "::error::expected 8 release binaries, found ${#assets[@]}: ${assets[*]}"
            exit 1
          fi
          sha256sum "${assets[@]}" > SHA256SUMS
          for asset in "${assets[@]}"; do
            awk -v asset="$asset" '$2 == asset' SHA256SUMS > "$asset.sha256"
            test -s "$asset.sha256"
          done
          sha256sum --check SHA256SUMS
          cat SHA256SUMS
      - name: Move release tag to merged commit
        id: tag
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          RELEASE_TAG="${RELEASE_BRANCH#release/version-sync-}"
          git push --force origin "$MERGE_SHA:refs/tags/$RELEASE_TAG"
          # git-cliff reads the local tag to find the commits of this release.
          git tag --force "$RELEASE_TAG" "$MERGE_SHA"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: List the commits of the release
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: commits.md
      - name: Write the release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          {
            # The hand-written CHANGELOG.md section of this version, if any.
            awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo
            echo "## Commits"
            cat commits.md
            echo
            echo "## Verifying the downloads"
            echo
            echo "Each binary has a \`.sha256\` file and \`SHA256SUMS\` lists them all; the Zed extension checks the checksum before it starts a downloaded server. To check a download manually: \`sha256sum --check --ignore-missing SHA256SUMS\` (or \`shasum -a 256 -c\` on macOS)."
          } > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          files: dist/*
          body_path: release-notes.md
