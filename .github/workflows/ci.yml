name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Format and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - name: Verify generated files are not tracked
        shell: bash
        run: |
          test -z "$(git ls-files -- 'grammars/**' '*.wasm' 'target/**')"

  native:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: xml-lsp.exe
            asset: xml-lsp-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: xml-lsp
            asset: xml-lsp-x86_64-unknown-linux-gnu
          - os: macos-13
            target: x86_64-apple-darwin
            binary: xml-lsp
            asset: xml-lsp-x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
            binary: xml-lsp
            asset: xml-lsp-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build -p xml-lsp --release --target ${{ matrix.target }}
      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: xml-lsp-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish native LSP release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: xml-lsp-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
