name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    tags:
      - "v*"

jobs:
  checks:
    name: Format and tests
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - name: Verify generated files are not tracked
        shell: bash
        run: |
          test -z "$(git ls-files -- 'grammars/**' '*.wasm' 'target/**')"

  conformance:
    name: Conformance suites
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      XML_TEST_SUITES_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: target/test-suites
          key: test-suites-${{ hashFiles('scripts/fetch-test-suites.sh') }}
      - run: scripts/fetch-test-suites.sh
      - run: cargo test --release -p xml-conformance
      - run: cargo test --release -p xml-lsp fixture_smoke

  prepare_release_pr:
    name: Prepare release version PR
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Commit synchronized versions and open PR
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          BRANCH="release/version-sync-$RELEASE_TAG"
          git switch -c "$BRANCH"
          VERSION="$VERSION" python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          package_pattern = re.compile(r'(?m)^(version\s*=\s*")[^"]+("\s*)$')
          for path in [
              pathlib.Path("Cargo.toml"),
              pathlib.Path("crates/xml-core/Cargo.toml"),
              pathlib.Path("crates/xsd-core/Cargo.toml"),
              pathlib.Path("crates/dtd-core/Cargo.toml"),
              pathlib.Path("crates/xml-lsp/Cargo.toml"),
              pathlib.Path("crates/xml-conformance/Cargo.toml"),
              pathlib.Path("extension.toml"),
          ]:
              content = path.read_text(encoding="utf-8")
              updated, count = package_pattern.subn(
                  rf'\g<1>{version}\g<2>', content, count=1
              )
              if count != 1:
                  raise SystemExit(f"Could not update version in {path}")
              path.write_text(updated, encoding="utf-8", newline="\n")
          PY

          VERSION="$VERSION" python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          path = pathlib.Path("extension.toml")
          content = path.read_text(encoding="utf-8")
          capability_pattern = re.compile(
              r'(?m)^(command\s*=\s*"xml-lsp-)[0-9]+\.[0-9]+\.[0-9]+(\.exe)?(")([ \t]*$)'
          )
          updated, count = capability_pattern.subn(
              rf'\g<1>{version}\g<2>\g<3>\g<4>', content
          )
          if count != 2:
              raise SystemExit(
                  f"Expected two xml-lsp process capabilities in {path}, found {count}"
              )
          path.write_text(updated, encoding="utf-8", newline="\n")
          PY

          cargo check --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml crates/*/Cargo.toml Cargo.lock extension.toml
          if git diff --cached --quiet; then
            echo "Versions are already synchronized."
            exit 0
          fi
          git commit -m "chore: synchronize release version $RELEASE_TAG"
          git push --force origin "HEAD:refs/heads/$BRANCH"

          PR_NUMBER=$(gh pr list --head "$BRANCH" --base "$DEFAULT_BRANCH" --state open --json number --jq '.[0].number')
          if [[ -z "$PR_NUMBER" ]]; then
            PR_URL=$(gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH" \
              --title "chore: synchronize release version $RELEASE_TAG" \
              --body "Synchronize Cargo, Cargo.lock, and extension.toml versions with release tag $RELEASE_TAG.\n\nMerge this PR to build and publish the release.")
            PR_NUMBER="${PR_URL##*/}"
          fi
          gh pr review "$PR_NUMBER" --approve || true

  native:
    name: Build ${{ matrix.target }}
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/version-sync-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: xml-lsp.exe
            asset: xml-lsp-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: xml-lsp
            asset: xml-lsp-x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            binary: xml-lsp
            asset: xml-lsp-aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build -p xml-lsp --release --target ${{ matrix.target }}
      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: xml-lsp-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish native LSP release assets
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/version-sync-v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: xml-lsp-*
          path: dist
          merge-multiple: true
      - name: Move release tag to merged commit
        id: tag
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          RELEASE_TAG="${RELEASE_BRANCH#release/version-sync-}"
          git push --force origin "$MERGE_SHA:refs/tags/$RELEASE_TAG"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          files: dist/*
          generate_release_notes: true
