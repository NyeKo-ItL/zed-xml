[package]
name = "xml-lsp"
version = "0.16.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[[bin]]
name = "xml-lsp"
path = "src/main.rs"

[dependencies]
lsp-server = "0.10"
serde_json = "1"
quick-xml = "0.42"
xml-core = { path = "../xml-core" }
dtd-core = { path = "../dtd-core" }
xpath-core = { path = "../xpath-core" }
xsd-core = { path = "../xsd-core" }

[dev-dependencies]
xml-conformance = { path = "../xml-conformance" }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "server"
harness = false
