id = "xml"
name = "XML"
description = "XML language support with syntax highlighting, schema-aware diagnostics, formatting, completion, and navigation via the native Rust LSP."
version = "0.16.0"
schema_version = 1
authors = ["NyeKo-ItL"]
repository = "https://github.com/NyeKo-ItL/zed-xml"

[grammars.xml]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-xml"
commit = "5000ae8f22d11fbe93939b05c1e37cf21117162d"
path = "xml"

[grammars.dtd]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-xml"
commit = "5000ae8f22d11fbe93939b05c1e37cf21117162d"
path = "dtd"

[language_servers.xml-lsp]
name = "XML Rust LSP"
languages = ["XML", "DTD"]

[[capabilities]]
kind = "process:exec"
command = "xml-lsp-0.16.0.exe"
args = ["--version"]

[[capabilities]]
kind = "process:exec"
command = "xml-lsp-0.16.0"
args = ["--version"]

# Downloads the xml-lsp binary and its .sha256 file from this repository's
# release matching the extension version (the version-sync job of ci.yml keeps
# the version segment in step with `version`).
[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["NyeKo-ItL", "zed-xml", "releases", "download", "v0.16.0", "*"]
