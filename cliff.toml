# git-cliff configuration (https://git-cliff.org).
#
# The release workflow uses it to list the conventional commits of a release
# in the GitHub release notes, after the hand-written CHANGELOG.md section.
# CHANGELOG.md stays the source of truth: to draft its `Unreleased` entries,
# run `git cliff --unreleased` and rewrite the output for users.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**breaking:** {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first | trim }} \
({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
commit_preprocessors = [
    # Link pull request numbers added by squash merges.
    { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/NyeKo-ItL/zed-xml/pull/${1}))" },
]
commit_parsers = [
    # Version synchronization commits opened by the release workflow.
    { message = "^chore: synchronize release version", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs?", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Tests" },
    { message = "^ci", group = "<!-- 6 -->Continuous integration" },
    { message = "^build", group = "<!-- 7 -->Build" },
    { message = "^chore", group = "<!-- 8 -->Miscellaneous" },
    { message = "^revert", group = "<!-- 9 -->Reverts" },
]
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "oldest"
