name = "DTD"
grammar = "dtd"
path_suffixes = ["dtd", "ent"]
block_comment = ["<!-- ", " -->"]
autoclose_before = ">)]\"'"
word_characters = ["-", ":", "."]

brackets = [
    { start = "<", end = ">", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "(", end = ")", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
]
